name: AI Auto SEO & New Tools Generator

on:
  schedule:
    # Every Sunday at 05:00 Pakistan Standard Time (00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Dependencies
        run: pip install google-generativeai
      - name: Generate proposed SEO changes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_tools.py
      - name: Open a review pull request instead of pushing to the live branch
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/weekly-ai-seo
          delete-branch: true
          title: "Weekly AI SEO suggestions"
          commit-message: "Prepare weekly AI SEO suggestions"
          body: |
            This pull request was generated by the scheduled SEO workflow.
            Please review every changed HTML file and test tool functionality before merging.
            The workflow does not push generated changes directly to main.
