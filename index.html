  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f8faff;
      --text: #101828;
      --muted: #667085;
      --border: #e4e7ec;
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --header: #080d1c;
      --header-2: #151b35;
      --white: #ffffff;
      --shadow: 0 12px 35px rgba(16, 24, 40, 0.08);
      --shadow-hover: 0 20px 45px rgba(79, 70, 229, 0.18);
    }

    body.dark {
      --bg: #080c16;
      --surface: #111827;
      --surface-soft: #172033;
      --text: #f8fafc;
      --muted: #aab4c5;
      --border: #28344c;
      --primary-light: #1c2350;
      --header: #050811;
      --header-2: #0d1427;
      --shadow: 0 15px 40px rgba(0,0,0,0.25);
      --shadow-hover: 0 20px 45px rgba(79,70,229,0.25);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background .25s ease, color .25s ease;
    }

    a {
      color: inherit;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(8, 13, 28, 0.96);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
    }

    .nav {
      max-width: 1200px;
      min-height: 68px;
      margin: auto;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }

    .brand-icon {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: linear-gradient(135deg,#6366f1,#8b5cf6);
      box-shadow: 0 8px 25px rgba(99,102,241,.35);
      font-weight: 900;
      font-size: 16px;
    }

    .brand-name {
      font-size: 17px;
    }

    .theme-btn {
      width: 41px;
      height: 41px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 10px;
      background: rgba(255,255,255,.07);
      color: #fff;
      cursor: pointer;
      font-size: 18px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      overflow: hidden;
      padding: 85px 20px 105px;
      text-align: center;
      color: #fff;
      background:
        radial-gradient(circle at 15% 20%, rgba(99,102,241,.35), transparent 30%),
        radial-gradient(circle at 85% 10%, rgba(139,92,246,.30), transparent 28%),
        linear-gradient(135deg,#080d1c 0%,#111936 55%,#17133a 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 920px;
      margin: auto;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      padding: 8px 15px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      color: #dce4ff;
      font-size: 13px;
      font-weight: 750;
    }

    .hero-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 10px rgba(52,211,153,.8);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(43px,7vw,74px);
      line-height: 1.02;
      letter-spacing: -3.5px;
      font-weight: 900;
    }

    .hero h1 span {
      color: #c4b5fd;
      background: linear-gradient(90deg,#a5b4fc,#c4b5fd,#f0abfc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      max-width: 740px;
      margin: 25px auto 0;
      color: #c7d0e3;
      font-size: 19px;
      line-height: 1.7;
    }

    .hero-stats {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 11px;
      margin-top: 34px;
    }

    .hero-stat {
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 11px;
      background: rgba(255,255,255,.06);
      color: #e0e7f5;
      font-size: 13px;
      font-weight: 700;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      position: relative;
      z-index: 5;
      max-width: 1200px;
      margin: auto;
      padding: 0 22px 75px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-wrap {
      position: relative;
      z-index: 50;
      max-width: 780px;
      margin: -34px auto 60px;
    }

    .search-box {
      position: relative;
      z-index: 51;
      display: flex;
      align-items: center;
      width: 100%;
      padding: 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.15);
    }

    .search-icon {
      padding: 0 13px;
      color: var(--muted);
      font-size: 22px;
      pointer-events: none;
    }

    #toolSearch {
      position: relative;
      z-index: 52;
      width: 100%;
      border: 0;
      outline: 0;
      padding: 15px 7px;
      background: transparent;
      color: var(--text);
      font-size: 16px;
    }

    #toolSearch::placeholder {
      color: var(--muted);
    }

    .search-count {
      margin-right: 6px;
      padding: 8px 12px;
      white-space: nowrap;
      border-radius: 9px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    /* =========================
       SECTIONS
    ========================= */

    .tool-section {
      position: relative;
      z-index: 10;
      margin-bottom: 58px;
    }

    .section-heading {
      position: relative;
      z-index: 11;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .section-title {
      margin: 0;
      font-size: 29px;
      line-height: 1.2;
      letter-spacing: -.8px;
      font-weight: 850;
    }

    .section-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .section-count {
      flex-shrink: 0;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
    }

    /* =========================
       TOOL GRID
    ========================= */

    .tools {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 17px;
    }

    .tool {
      position: relative;
      z-index: 21;
      display: block;
      min-height: 153px;
      padding: 23px;
      overflow: hidden;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 17px;

      color: var(--text);
      text-decoration: none;

      cursor: pointer;
      pointer-events: auto;

      box-shadow: 0 3px 10px rgba(16,24,40,.025);

      transition:
        transform .22s ease,
        box-shadow .22s ease,
        border-color .22s ease;
    }

    .tool:hover {
      z-index: 30;
      transform: translateY(-6px);
      border-color: rgba(99,102,241,.38);
      box-shadow: var(--shadow-hover);
    }

    .tool::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(180deg,#6366f1,#8b5cf6);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .tool:hover::before {
      opacity: 1;
    }

    .tool-top {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .format {
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface-soft);
      color: var(--primary);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .4px;
      text-transform: uppercase;
    }

    .arrow {
      position: relative;
      z-index: 2;
      color: var(--muted);
      font-size: 17px;
      pointer-events: none;
      transition: transform .2s ease,color .2s ease;
    }

    .tool:hover .arrow {
      transform: translateX(5px);
      color: var(--primary);
    }

    .tool strong {
      position: relative;
      z-index: 2;
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-size: 21px;
      line-height: 1.25;
      letter-spacing: -.4px;
      font-weight: 900;
      pointer-events: none;
    }

    .tool span:not(.format):not(.arrow) {
      position: relative;
      z-index: 2;
      display: block;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      pointer-events: none;
    }

    /* =========================
       FEATURED
    ========================= */

    .featured {
      position: relative;
      z-index: 10;
      margin-bottom: 58px;
      padding: 31px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background:
        radial-gradient(circle at 85% 15%,rgba(99,102,241,.16),transparent 35%),
        linear-gradient(135deg,var(--surface),var(--surface-soft));
      box-shadow: var(--shadow);
    }

    .featured h2 {
      margin: 0 0 7px;
      font-size: 24px;
      letter-spacing: -.5px;
    }

    .featured p {
      margin: 0;
      color: var(--muted);
    }

    .featured-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .featured-links a {
      position: relative;
      z-index: 5;
      display: inline-block;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 750;
      transition: transform .2s ease;
    }

    .featured-links a:hover {
      transform: translateY(-2px);
    }

    /* =========================
       INFORMATION
    ========================= */

    .info {
      position: relative;
      z-index: 10;
      padding: 31px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .info h3 {
      margin: 27px 0 8px;
      font-size: 19px;
    }

    .info h3:first-child {
      margin-top: 0;
    }

    .info p {
      margin: 8px 0;
      color: var(--muted);
    }

    .info a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 750;
    }

    .info a:hover {
      text-decoration: underline;
    }

    /* =========================
       NO RESULTS
    ========================= */

    #noResults {
      display: none;
      position: relative;
      z-index: 20;
      margin-bottom: 40px;
      padding: 45px 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      color: var(--muted);
      text-align: center;
    }

    #noResults strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 19px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 45px 20px;
      background: var(--header);
      color: #aeb8cb;
      text-align: center;
    }

    .footer-brand {
      margin-bottom: 7px;
      color: #fff;
      font-size: 18px;
      font-weight: 850;
    }

    footer p {
      margin: 6px 0;
      font-size: 13px;
    }

    footer a {
      color: #dbe3f2;
      text-decoration: none;
    }

    footer a:hover {
      color: #fff;
      text-decoration: underline;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 950px) {
      .tools {
        grid-template-columns: repeat(2,minmax(0,1fr));
      }
    }

    @media (max-width: 650px) {

      .nav {
        min-height: 62px;
        padding: 0 15px;
      }

      .brand-name {
        font-size: 14px;
      }

      .brand-icon {
        width: 35px;
        height: 35px;
      }

      .hero {
        padding: 60px 18px 85px;
      }

      .hero h1 {
        font-size: 43px;
        letter-spacing: -2.2px;
      }

      .hero p {
        font-size: 16px;
      }

      .hero-stat {
        font-size: 11px;
        padding: 9px 12px;
      }

      main {
        padding: 0 15px 55px;
      }

      .search-wrap {
        margin-top: -30px;
        margin-bottom: 45px;
      }

      .search-count {
        display: none;
      }

      .tools {
        grid-template-columns: 1fr;
        gap: 13px;
      }

      .tool {
        min-height: 138px;
        padding: 21px;
      }

      .tool strong {
        font-size: 20px;
      }

      .section-heading {
        align-items: flex-start;
      }

      .section-title {
        font-size: 24px;
      }

      .section-count {
        font-size: 10px;
      }

      .featured,
      .info {
        padding: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">

      <a class="brand" href="index.html">

      </button>

    </nav>
  </div>


  <!-- HERO -->

      </div>

  </header>


  <main>

    <!-- SEARCH -->
    <div class="search-wrap">

      <div class="search-box">

        <span class="search-icon">⌕</span>

        <input
          type="search"
          id="toolSearch"
          placeholder="Search tools... e.g. CSV to
