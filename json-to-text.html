<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Convert JSON data to clean readable text instantly in your browser. Free and privacy-friendly JSON to Text converter.">

<title>JSON to Text Converter - Free Online Tool</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
    }

    .card {
        background: #fff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
        margin-top: 0;
        font-size: 28px;
    }

    p {
        color: #555;
        line-height: 1.6;
    }

    textarea {
        width: 100%;
        min-height: 230px;
        padding: 14px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-family: monospace;
        font-size: 14px;
        resize: vertical;
    }

    .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 15px 0;
    }

    button {
        padding: 11px 18px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        background: #222;
        color: white;
        font-size: 14px;
    }

    button:hover {
        opacity: 0.85;
    }

    .status {
        margin: 10px 0;
        font-weight: bold;
    }

    .privacy {
        margin-top: 20px;
        padding: 12px;
        background: #f0f7f0;
        border-radius: 7px;
        font-size: 14px;
    }

    .back {
        display: inline-block;
        margin-top: 20px;
        text-decoration: none;
        color: #333;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>JSON to Text Converter</h1>

        <p>
            Convert JSON data into clean, readable plain text instantly in your browser.
            Your data stays on your device.
        </p>

        <textarea id="input" placeholder="Paste JSON data here..."></textarea>

        <div class="buttons">
            <button onclick="convertJSON()">Convert to Text</button>
            <button onclick="copyText()">Copy Text</button>
            <button onclick="downloadText()">Download TXT</button>
            <button onclick="clearAll()">Clear</button>
        </div>

        <div id="status" class="status"></div>

        <textarea id="output" placeholder="Text output will appear here..." readonly></textarea>

        <div class="privacy">
            🔒 Privacy-friendly: Your data is processed locally in your browser and is not uploaded to a server.
        </div>

        <a class="back" href="index.html">← Back to All Tools</a>

    </div>
</div>

<script>

let textResult = "";

function formatValue(value, indent = 0) {

    const spaces = " ".repeat(indent);

    if (value === null) {
        return "null";
    }

    if (typeof value === "object") {

        if (Array.isArray(value)) {

            if (value.length === 0) {
                return "[]";
            }

            return value.map((item, index) => {

                if (typeof item === "object" && item !== null) {
                    return (
                        spaces +
                        "-\n" +
                        formatValue(item, indent + 2)
                    );
                }

                return (
                    spaces +
                    "- " +
                    formatValue(item, indent + 2)
                );

            }).join("\n");
        }

        const keys = Object.keys(value);

        if (keys.length === 0) {
            return "{}";
        }

        return keys.map(key => {

            const item = value[key];

            if (
                typeof item === "object" &&
                item !== null
            ) {
                return (
                    spaces +
                    key +
                    ":\n" +
                    formatValue(item, indent + 2)
                );
            }

            return (
                spaces +
                key +
                ": " +
                formatValue(item, indent)
            );

        }).join("\n");
    }

    if (typeof value === "string") {
        return value;
    }

    if (typeof value === "boolean") {
        return value ? "true" : "false";
    }

    return String(value);
}

function convertJSON() {

    const input = document.getElementById("input").value.trim();
    const output = document.getElementById("output");
    const status = document.getElementById("status");

    try {

        if (!input) {
            throw new Error("Please enter JSON data.");
        }

        const data = JSON.parse(input);

        textResult = formatValue(data);

        output.value = textResult;

        status.textContent = "JSON converted to text successfully.";
        status.style.color = "green";

    } catch (error) {

        textResult = "";
        output.value = "";

        status.textContent = "Invalid JSON: " + error.message;
        status.style.color = "red";
    }
}

function copyText() {

    const output = document.getElementById("output");
    const status = document.getElementById("status");

    if (!output.value) {

        status.textContent = "Please convert JSON data first.";
        status.style.color = "red";

        return;
    }

    navigator.clipboard.writeText(output.value)
        .then(() => {

            status.textContent = "Text copied to clipboard.";
            status.style.color = "green";

        })
        .catch(() => {

            status.textContent = "Unable to copy text.";
            status.style.color = "red";

        });
}

function downloadText() {

    const output = document.getElementById("output");
    const status = document.getElementById("status");

    if (!output.value) {

        status.textContent = "Please convert JSON data first.";
        status.style.color = "red";

        return;
    }

    const blob = new Blob(
        [output.value],
        { type: "text/plain;charset=utf-8;" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "converted.txt";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    URL.revokeObjectURL(url);

    status.textContent = "TXT file downloaded.";
    status.style.color = "green";
}

function clearAll() {

    document.getElementById("input").value = "";
    document.getElementById("output").value = "";
    document.getElementById("status").textContent = "";

    textResult = "";
}

</script>

</body>
</html>
