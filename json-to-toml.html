<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JSON to TOML Converter</title>
  <meta name="description" content="Convert JSON to TOML instantly in your browser. Free, fast and privacy-focused.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
      text-align: center;
    }

    .description {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-family: monospace;
      font-size: 14px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }

    button {
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      background: #2563eb;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .success {
      background: #16a34a;
    }

    .danger {
      background: #dc2626;
    }

    .status {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .privacy {
      margin-top: 20px;
      padding: 12px;
      background: #eef6ff;
      border-radius: 8px;
      color: #374151;
      font-size: 14px;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {
        margin: 15px auto;
        padding: 12px;
      }

      .card {
        padding: 18px;
      }

      h1 {
        font-size: 24px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>JSON to TOML Converter</h1>

    <p class="description">
      Convert JSON data to readable TOML instantly in your browser.
    </p>

    <label for="jsonInput">JSON Input</label>

    <textarea
      id="jsonInput"
      placeholder='Paste JSON here, for example: {"name":"Ali","age":28}'
    ></textarea>

    <div class="buttons">
      <button onclick="convertToTOML()">Convert to TOML</button>
      <button class="success" onclick="copyTOML()">Copy TOML</button>
      <button onclick="downloadTOML()">Download TOML</button>
      <button class="danger" onclick="clearAll()">Clear</button>
    </div>

    <div id="status" class="status"></div>

    <label for="tomlOutput">TOML Output</label>

    <textarea
      id="tomlOutput"
      readonly
      placeholder="Converted TOML will appear here..."
    ></textarea>

    <div class="privacy">
      🔒 <strong>Privacy:</strong> Your data is processed entirely in your browser.
      Nothing is uploaded to our server.
    </div>

    <a class="back" href="index.html">← Back to All Tools</a>

  </div>
</div>

<script>
function showStatus(message, type = "success") {
  const status = document.getElementById("status");

  status.textContent = message;
  status.style.display = "block";

  if (type === "error") {
    status.style.background = "#fee2e2";
    status.style.color = "#991b1b";
  } else {
    status.style.background = "#dcfce7";
    status.style.color = "#166534";
  }
}

function escapeTOMLString(value) {
  return '"' + String(value)
    .replace(/\\/g, "\\\\")
    .replace(/"/g, '\\"')
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r")
    .replace(/\t/g, "\\t") + '"';
}

function formatTOMLValue(value) {
  if (typeof value === "string") {
    return escapeTOMLString(value);
  }

  if (typeof value === "number") {
    if (!Number.isFinite(value)) {
      throw new Error("TOML does not support Infinity or NaN.");
    }
    return String(value);
  }

  if (typeof value === "boolean") {
    return value ? "true" : "false";
  }

  if (value === null) {
    throw new Error("TOML does not support null values.");
  }

  if (Array.isArray(value)) {
    if (value.length === 0) {
      return "[]";
    }

    if (value.some(item => item !== null &&
      typeof item === "object" &&
      !Array.isArray(item))) {
      throw new Error(
        "Arrays of objects are not supported by this simple converter."
      );
    }

    return "[" + value.map(item => {
      if (item === null) {
        throw new Error("TOML does not support null values.");
      }

      if (Array.isArray(item)) {
        return "[" + item.map(formatTOMLValue).join(", ") + "]";
      }

      return formatTOMLValue(item);
    }).join(", ") + "]";
  }

  throw new Error("Unsupported JSON value.");
}

function isPlainObject(value) {
  return value !== null &&
    typeof value === "object" &&
    !Array.isArray(value);
}

function convertObject(object, section = "") {
  let lines = [];
  let nestedObjects = [];

  for (const key of Object.keys(object)) {
    const value = object[key];

    if (isPlainObject(value)) {
      nestedObjects.push([key, value]);
    } else {
      lines.push(
        key + " = " + formatTOMLValue(value)
      );
    }
  }

  if (section && lines.length > 0) {
    lines.unshift("[" + section + "]");
  }

  for (const [key, value] of nestedObjects) {
    const newSection = section
      ? section + "." + key
      : key;

    if (lines.length > 0) {
      lines.push("");
    }

    lines = lines.concat(
      convertObject(value, newSection)
    );
  }

  return lines;
}

function convertToTOML() {
  const input = document.getElementById("jsonInput").value.trim();
  const output = document.getElementById("tomlOutput");

  if (!input) {
    showStatus("Please enter JSON data.", "error");
    return;
  }

  try {
    const json = JSON.parse(input);

    if (!isPlainObject(json)) {
      throw new Error(
        "The JSON root must be an object."
      );
    }

    const toml = convertObject(json).join("\n");

    output.value = toml;

    showStatus("JSON converted to TOML successfully.");

  } catch (error) {
    output.value = "";

    showStatus(
      "Unable to convert JSON to TOML: " + error.message,
      "error"
    );
  }
}

async function copyTOML() {
  const output = document.getElementById("tomlOutput").value;

  if (!output) {
    showStatus("Please convert JSON first.", "error");
    return;
  }

  try {
    await navigator.clipboard.writeText(output);
    showStatus("TOML copied to clipboard.");
  } catch (error) {
    showStatus(
      "Unable to copy. Please copy it manually.",
      "error"
    );
  }
}

function downloadTOML() {
  const output = document.getElementById("tomlOutput").value;

  if (!output) {
    showStatus("Please convert JSON first.", "error");
    return;
  }

  const blob = new Blob([output], {
    type: "text/plain;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "converted.toml";

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  URL.revokeObjectURL(url);

  showStatus("TOML file downloaded.");
}

function clearAll() {
  document.getElementById("jsonInput").value = "";
  document.getElementById("tomlOutput").value = "";
  document.getElementById("status").style.display = "none";
}
</script>

</body>
</html>
