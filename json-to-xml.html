<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JSON to XML Converter - Free Online Tool</title>

  <meta name="description" content="Convert JSON data to XML online for free. Generate clean XML from JSON instantly in your browser. Fast, simple and privacy-focused.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      width: 92%;
      max-width: 1000px;
      margin: auto;
      padding: 30px 0;
    }

    .tool {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
    }

    .description {
      text-align: center;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 8px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
    }

    input {
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 280px;
      resize: vertical;
      font-family: monospace;
      line-height: 1.5;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    .buttons {
      margin: 15px 0;
    }

    button {
      padding: 11px 17px;
      margin: 5px 5px 5px 0;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .primary:hover {
      background: #1d4ed8;
    }

    .secondary {
      background: #e5e7eb;
      color: #222;
    }

    .success {
      background: #16a34a;
      color: white;
    }

    .status {
      display: none;
      margin: 15px 0;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
      font-size: 14px;
    }

    .valid {
      background: #f0fdf4;
      color: #166534;
    }

    .invalid {
      background: #fef2f2;
      color: #991b1b;
    }

    .privacy {
      margin-top: 25px;
      padding: 15px;
      background: #f0fdf4;
      color: #166534;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
        padding: 15px 0;
      }

      .tool {
        padding: 18px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="tool">

      <h1>JSON to XML Converter</h1>

      <p class="description">
        Convert JSON data into clean XML instantly in your browser.
        Your data stays on your device.
      </p>

      <label for="rootName">XML Root Name</label>

      <input
        type="text"
        id="rootName"
        value="root"
        placeholder="Enter root name, e.g. users"
      >

      <label for="jsonInput">Enter JSON</label>

      <textarea id="jsonInput">[
  {
    "name": "Ali",
    "age": 28,
    "city": "Karachi"
  },
  {
    "name": "Emma",
    "age": 34,
    "city": "London"
  }
]</textarea>

      <div class="buttons">
        <button class="primary" onclick="convertToXML()">Convert to XML</button>
        <button class="secondary" onclick="clearAll()">Clear</button>
      </div>

      <div id="status" class="status"></div>

      <label for="xmlOutput">XML Output</label>

      <textarea
        id="xmlOutput"
        readonly
        placeholder="XML output will appear here..."
      ></textarea>

      <div class="buttons">
        <button class="success" onclick="copyXML()">Copy XML</button>
        <button class="primary" onclick="downloadXML()">Download XML</button>
      </div>

      <div class="privacy">
        <strong>Privacy First</strong><br>
        This JSON to XML converter processes your data directly in your browser.
        Your JSON is not uploaded to our server.
      </div>

      <a class="back" href="index.html">← Back to All Tools</a>

    </div>

  </div>

  <script>

    function showStatus(message, type) {
      const status = document.getElementById("status");

      status.textContent = message;
      status.className = "status " + type;
      status.style.display = "block";
    }

    function escapeXML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&apos;");
    }

    function isValidXMLName(name) {
      return /^[A-Za-z_][A-Za-z0-9_.-]*$/.test(name);
    }

    function convertValue(value, tagName, level) {

      const indent = "  ".repeat(level);

      if (value === null || value === undefined) {
        return `${indent}<${tagName}></${tagName}>`;
      }

      if (Array.isArray(value)) {

        if (value.length === 0) {
          return `${indent}<${tagName}></${tagName}>`;
        }

        return [
          `${indent}<${tagName}>`,
          ...value.map(item =>
            convertValue(item, "item", level + 1)
          ),
          `${indent}</${tagName}>`
        ].join("\n");
      }

      if (typeof value === "object") {

        const keys = Object.keys(value);

        if (keys.length === 0) {
          return `${indent}<${tagName}></${tagName}>`;
        }

        return [
          `${indent}<${tagName}>`,
          ...keys.map(key => {

            const safeKey = isValidXMLName(key)
              ? key
              : "field";

            return convertValue(
              value[key],
              safeKey,
              level + 1
            );
          }),
          `${indent}</${tagName}>`
        ].join("\n");
      }

      return `${indent}<${tagName}>${escapeXML(value)}</${tagName}>`;
    }

    function convertToXML() {

      const input =
        document.getElementById("jsonInput").value.trim();

      const rootName =
        document.getElementById("rootName").value.trim();

      if (!input) {
        showStatus(
          "Please enter JSON data.",
          "invalid"
        );
        return;
      }

      if (!rootName) {
        showStatus(
          "Please enter an XML root name.",
          "invalid"
        );
        return;
      }

      if (!isValidXMLName(rootName)) {
        showStatus(
          "Invalid root name. Use letters, numbers, underscores, dots or hyphens, and do not start with a number.",
          "invalid"
        );
        return;
      }

      try {

        const data = JSON.parse(input);

        const xml = [
          '<?xml version="1.0" encoding="UTF-8"?>',
          convertValue(data, rootName, 0)
        ].join("\n");

        document.getElementById("xmlOutput").value = xml;

        showStatus(
          "Valid JSON. XML generated successfully.",
          "valid"
        );

      } catch (error) {

        document.getElementById("xmlOutput").value = "";

        showStatus(
          "Invalid JSON: " + error.message,
          "invalid"
        );
      }
    }

    function copyXML() {

      const output =
        document.getElementById("xmlOutput").value;

      if (!output) {
        showStatus(
          "Please convert JSON to XML first.",
          "invalid"
        );
        return;
      }

      navigator.clipboard.writeText(output)
        .then(() => {

          showStatus(
            "XML copied to clipboard.",
            "valid"
          );

        })
        .catch(() => {

          showStatus(
            "Unable to copy XML.",
            "invalid"
          );

        });
    }

    function downloadXML() {

      const output =
        document.getElementById("xmlOutput").value;

      if (!output) {
        showStatus(
          "Please convert JSON to XML first.",
          "invalid"
        );
        return;
      }

      const blob = new Blob(
        [output],
        { type: "application/xml;charset=utf-8;" }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");

      link.href = url;
      link.download = "converted.xml";

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(url);

      showStatus(
        "XML file downloaded.",
        "valid"
      );
    }

    function clearAll() {

      document.getElementById("jsonInput").value = "";
      document.getElementById("xmlOutput").value = "";
      document.getElementById("rootName").value = "root";

      const status =
        document.getElementById("status");

      status.style.display = "none";
      status.textContent = "";
    }

  </script>

</body>
</html>
